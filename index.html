<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<title>ReconstructNodes</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			overscroll-behavior: none;
			background: #121724;
			touch-action: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
			-webkit-tap-highlight-color: transparent;
		}
		/* iOS WebKit 會拒絕 user-select:none 的 input 輸入，Godot 虛擬鍵盤依賴隱藏 input */
		input, textarea {
			-webkit-user-select: text;
			user-select: text;
			font-size: 16px;
		}
		body {
			position: fixed;
			inset: 0;
		}
		#canvas {
			display: block;
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			outline: none;
		}
		#status {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			color: #cfd6e6;
			font: 15px sans-serif;
			background: #121724;
		}
		#status-logo { width: 96px; height: 96px; margin-bottom: 28px; border-radius: 20px; }
		#status-bar {
			width: 60%;
			max-width: 260px;
			height: 8px;
			border-radius: 4px;
			background: #2a3248;
			overflow: hidden;
		}
		#status-fill { width: 0; height: 100%; background: #f2b84b; transition: width 0.15s linear; }
		#status-text { margin-top: 12px; font-variant-numeric: tabular-nums; }
		#status-notice {
			display: none;
			margin: 16px;
			text-align: center;
			white-space: pre-wrap;
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">Your browser does not support HTML5 canvas.</canvas>
	<div id="status">
		<img id="status-logo" src="index.icon.png" alt="" onerror="this.style.display='none'">
		<div id="status-bar"><div id="status-fill"></div></div>
		<div id="status-text"></div>
		<div id="status-notice"></div>
	</div>
	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":25126360,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const engine = new Engine(GODOT_CONFIG);
		const statusEl = document.getElementById('status');
		const barEl = document.getElementById('status-bar');
		const fillEl = document.getElementById('status-fill');
		const textEl = document.getElementById('status-text');
		const noticeEl = document.getElementById('status-notice');
		const isZh = (navigator.language || '').toLowerCase().startsWith('zh');
		const TEXT = isZh
			? { loading: '載入遊戲中', init: '正在啟動遊戲…' }
			: { loading: 'Loading', init: 'Starting game…' };

		function showNotice(text) {
			barEl.style.display = 'none';
			textEl.style.display = 'none';
			noticeEl.style.display = 'block';
			noticeEl.textContent = text;
		}

		function updateProgress(current, total) {
			if (!(total > 0)) {
				textEl.textContent = TEXT.loading + '…';
				return;
			}
			const ratio = Math.min(current / total, 1);
			fillEl.style.width = (ratio * 100).toFixed(1) + '%';
			if (ratio >= 1) {
				textEl.textContent = TEXT.init;
			} else {
				const mb = (n) => (n / 1048576).toFixed(1);
				textEl.textContent = TEXT.loading + ' ' + Math.floor(ratio * 100) + '%（' + mb(current) + ' / ' + mb(total) + ' MB）';
			}
		}

		const missing = Engine.getMissingFeatures({ threads: GODOT_CONFIG.ensureCrossOriginIsolationHeaders });
		if (missing.length > 0) {
			showNotice('Browser unsupported:\n' + missing.join('\n'));
		} else {
			updateProgress(0, 0);
			engine.startGame({ onProgress: updateProgress }).then(() => {
				statusEl.style.display = 'none';
			}, (err) => {
				showNotice(String(err));
			});
		}

		// 阻擋下拉重新整理與頁面捲動／位移；遊戲內觸控由 canvas 自行處理
		document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
		document.addEventListener('gesturestart', (e) => e.preventDefault());

		// Godot 的虛擬鍵盤會對 type=email／number 的隱藏 input 呼叫 setSelectionRange，瀏覽器對這些型別直接丟例外，
		// 例外發生在 focus() 之前，鍵盤就叫不出來；吞掉例外讓 Email／驗證碼輸入框也能開鍵盤。
		const nativeSetSelectionRange = HTMLInputElement.prototype.setSelectionRange;
		HTMLInputElement.prototype.setSelectionRange = function () {
			try { return nativeSetSelectionRange.apply(this, arguments); } catch (e) { /* 該型別不支援選取範圍 */ }
		};

		// iOS 只允許在使用者手勢（touchend 等）的呼叫堆疊裡 focus() 隱藏 input 才會升起鍵盤；Godot 在遊戲迴圈裡才處理輸入，
		// 呼叫 focus() 時手勢已過。遊戲端（WebVirtualKeyboard）回報目前有輸入框取得焦點與文字，
		// 這裡在每次 touchend 後的 1 秒內（WebKit 會把手勢授權延續給這段時間內的計時器）補一次 focus。
		const vkState = { wanted: false, multiline: false, text: '', caret: 0, useJs: false };
		window.rnKeyboard = (wanted, multiline, text, caret, useJs) => {
			vkState.wanted = wanted;
			vkState.multiline = multiline;
			vkState.text = text;
			vkState.caret = caret;
			vkState.useJs = useJs;
			vkElement();
		};
		const vkElement = () => {
			const all = Array.from(document.querySelectorAll('input, textarea')).filter((el) => el.style.zIndex === '-1');
			all.forEach((el) => {
				if (el.rnBound) { return; }
				el.rnBound = true;
				// 子視窗內的輸入框收不到 Godot 轉送的輸入，改由這裡直接把文字傳回遊戲
				el.addEventListener('input', () => {
					if (window.rnDebug) { window.rnDebug('JS:input useJs=' + vkState.useJs + ' cb=' + !!window.rnKeyboardInput + ' len=' + el.value.length); }
					if (vkState.useJs && window.rnKeyboardInput) {
						vkState.text = el.value;
						window.rnKeyboardInput(el.value, el.selectionEnd);
					}
				});
			});
			return all.find((el) => el.style.display === 'block') || all.find((el) => (el.tagName === 'TEXTAREA') === vkState.multiline);
		};
		const vkRefocus = () => {
			const el = vkElement();
			if (!vkState.wanted || !el || document.activeElement === el) { return; }
			if (el.style.display !== 'block') {
				el.disabled = false;
				el.readOnly = false;
				el.value = vkState.text;
				el.style.display = 'block';
			}
			el.focus();
			el.setSelectionRange(vkState.caret, vkState.caret);
			if (window.rnDebug) { window.rnDebug('JS:refocus ' + el.tagName + ' active=' + (document.activeElement === el)); }
		};
		window.addEventListener('touchend', () => {
			let ticks = 0;
			const tick = () => {
				vkRefocus();
				if (++ticks < 12) { setTimeout(tick, 60); }
			};
			tick();
		}, { capture: true, passive: true });

		// 網址帶 ?debug=touch 時，在畫面上顯示瀏覽器實際送到頁面的觸控／指標／滑鼠事件，
		// 用來在 iOS 實機區分「事件沒進來」與「遊戲沒處理」；一般玩家不會看到。
		if (new URLSearchParams(location.search).get('debug') === 'touch') {
			const panel = document.createElement('pre');
			panel.style.cssText = 'position:fixed;left:0;top:0;right:0;z-index:20;margin:0;padding:4px;max-height:40%;overflow:hidden;pointer-events:none;font:10px/1.3 monospace;color:#9f9;background:rgba(0,0,0,0.65);white-space:pre-wrap';
			document.body.appendChild(panel);
			const lines = [];
			let last = '';
			let repeat = 1;
			const push = (key, text) => {
				if (key === last && lines.length > 0) {
					repeat++;
					lines[lines.length - 1] = text + ' x' + repeat;
				} else {
					last = key;
					repeat = 1;
					lines.push(text);
					if (lines.length > 18) { lines.shift(); }
				}
				panel.textContent = lines.join('\n');
			};
			const record = (e) => {
				const p = (e.changedTouches && e.changedTouches[0]) || e;
				const tag = e.target && e.target.tagName ? e.target.tagName : '?';
				push(e.type + tag, e.type + ' ' + Math.round(p.clientX) + ',' + Math.round(p.clientY) + (e.cancelable === false ? ' !cancelable' : '') + (e.defaultPrevented ? ' prevented' : ''));
			};
			// 遊戲端（WebTouchDebug）寫入的狀態，字串開頭為 G:
			window.rnDebug = (text) => push(text, text);
			['touchstart', 'touchmove', 'touchend', 'touchcancel', 'pointerdown', 'pointercancel', 'pointerup', 'mousedown', 'mouseup', 'click']
				.forEach((type) => window.addEventListener(type, record, { capture: true, passive: true }));
		}

		// Google 登入橋接：結果以 (requestId, outcome, idToken) 回呼，outcome 與 GoogleNativeSignIn.Outcome 一致
		const GOOGLE_OUTCOME = { SUCCESS: 0, CANCELLED: 1, NO_CREDENTIAL: 2, FAILED: 3 };
		let gsiLoading = null;
		let activeRequest = null;

		function loadGsi() {
			if (!gsiLoading) {
				gsiLoading = new Promise((resolve, reject) => {
					const script = document.createElement('script');
					script.src = 'https://accounts.google.com/gsi/client';
					script.async = true;
					script.onload = resolve;
					script.onerror = () => { gsiLoading = null; reject(new Error('gsi load failed')); };
					document.head.appendChild(script);
				});
			}
			return gsiLoading;
		}

		function closeGoogleOverlay() {
			const overlay = document.getElementById('google-auth-overlay');
			if (overlay) { overlay.remove(); }
		}

		function finishGoogle(requestId, outcome, token) {
			if (!activeRequest || activeRequest.id !== requestId) { return; }
			const callback = activeRequest.callback;
			activeRequest = null;
			closeGoogleOverlay();
			callback(requestId, outcome, token || '');
		}

		function showGoogleOverlay(requestId, clientId) {
			closeGoogleOverlay();
			const overlay = document.createElement('div');
			overlay.id = 'google-auth-overlay';
			overlay.style.cssText = 'position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,0.7)';
			const holder = document.createElement('div');
			const cancel = document.createElement('button');
			cancel.textContent = '\u2715';
			cancel.style.cssText = 'font:18px sans-serif;padding:8px 20px;border:0;border-radius:6px;background:#eee;color:#333';
			cancel.onclick = () => finishGoogle(requestId, GOOGLE_OUTCOME.CANCELLED, '');
			overlay.append(holder, cancel);
			document.body.appendChild(overlay);
			google.accounts.id.initialize({
				client_id: clientId,
				callback: (response) => finishGoogle(requestId, response.credential ? GOOGLE_OUTCOME.SUCCESS : GOOGLE_OUTCOME.NO_CREDENTIAL, response.credential),
				cancel_on_tap_outside: false,
			});
			google.accounts.id.renderButton(holder, { type: 'standard', theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with' });
		}

		window.reconstructWebAuth = {
			request(clientId, requestId, callback) {
				if (activeRequest) { finishGoogle(activeRequest.id, GOOGLE_OUTCOME.CANCELLED, ''); }
				activeRequest = { id: requestId, callback };
				loadGsi().then(
					() => { if (activeRequest && activeRequest.id === requestId) { showGoogleOverlay(requestId, clientId); } },
					() => finishGoogle(requestId, GOOGLE_OUTCOME.FAILED, ''));
			},
			cancel() {
				if (activeRequest) { finishGoogle(activeRequest.id, GOOGLE_OUTCOME.CANCELLED, ''); }
			},
		};
	</script>
</body>
</html>
